<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>緹地導航列示範</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="a.css">
</head>

<body>
    <!-- 📦 側邊欄整體容器 -->
    <div class="sidebar">

        <!-- 🔹 上半部：Logo + 導覽清單 -->
        <div>
            <!-- Logo 區 -->
            <div class="p-3 text-center border-bottom">
                <!-- 假的佔位圖，可換成你的 LOGO -->
                <img src="logo.png" alt="logo" class="img-fluid" style="width: 60px;">
            </div>

            <!-- 導覽連結清單 -->
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link active" href="#" data-image="1.jpg"
                        data-content="#content-home"><i class="bi bi-house-door-fill"></i> </a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-image="2.jpg"
                        data-content="#content-milestone"><i class="bi bi-calendar2-check"></i> 預約里程碑</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-image="3.jpg" data-content="#content-intel"><i
                            class="bi bi-person-badge"></i>
                        幹員情報</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-image="4.jpg" data-content="#content-world"><i
                            class="bi bi-globe"></i>
                        世界觀資料</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-image="5.jpg" data-content="#content-video"><i
                            class="bi bi-camera-reels"></i>
                        影像資料</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-image="6.png" data-content="#content-gameplay"><i
                            class="bi bi-joystick"></i> 玩法介紹
                        & 集成工業知識</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-image="1.jpg" data-content="#content-announce"><i
                            class="bi bi-megaphone"></i>
                        公告</a></li>
            </ul>
        </div>

        <!-- 🔸 下半部：用戶資訊 / 按鈕 / 社群連結 -->
        <div class="bottom-section">
            <!-- 用戶資料區 -->
            <div class="mb-3">
                <div class="border rounded p-2 mb-2 text-center"><i class="bi bi-person"></i> 用戶</div>
                <div class="border rounded p-2 mb-2 text-center"><i class="bi bi-brush"></i> 創作者</div>
                <div class="border rounded p-2 mb-3 text-center"><i class="bi bi-volume-mute"></i> 聲音：關閉</div>
            </div>

            <!-- 「立即預約」按鈕 -->
            <button class="btn btn-reserve mb-3">立即預約</button>

            <!-- 底部社群 icon -->
            <div class="social-icons text-center">
                <a href="#"><i class="bi bi-twitter-x"></i></a>
                <a href="#"><i class="bi bi-facebook"></i></a>
                <a href="#"><i class="bi bi-youtube"></i></a>
                <a href="#"><i class="bi bi-controller"></i></a>
            </div>
        </div>
    </div>
    <div class="main-content">

        <div class="image-section">
            <img src="1.jpg" alt="Workshop Image" id="main-image">
        </div>

        <div class="text-section active-content" id="content-home">
            <h2>首頁 內容</h2>
            <p>這是「首頁」的空白區域。</p>
            <textarea placeholder="..."></textarea>
        </div>

        <div class="text-section" id="content-milestone">
            <h2>預約里程碑 內容</h2>
            <p>這是「預約里程碑」的空白區域。</p>
        </div>

        <div class="text-section" id="content-intel">
            <h2>幹員情報 內容</h2>
            <p>這是「幹員情報」的空白區域。</p>
        </div>

        <div class="text-section" id="content-world">
            <h2>世界觀資料 內容</h2>
            <p>這是「世界觀資料」的空白區域。</p>
        </div>

        <div class="text-section" id="content-video">
            <h2>影像資料 內容</h2>
            <p>這是「影像資料」的空白區域。</p>
        </div>

        <div class="text-section" id="content-gameplay">
            <h2>玩法介紹 內容</h2>
            <p>這是「玩法介紹」的空白區域。</p>
        </div>

        <div class="text-section" id="content-announce">
            <h2>公告 內容</h2>
            <p>這是「公告」的空白區域。</p>
        </div>
    </div>
    <!-- Bootstrap JS（必須放在 body 最後） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js" defer></script>
</body>

</html>
