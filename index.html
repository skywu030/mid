<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>緹地導航列示範</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="a.css">
</head>

<body>
    <!-- 📦 側邊欄整體容器 -->
    <div class="sidebar">

        <!-- 🔹 上半部：Logo + 導覽清單 -->
        <div>
            <!-- Logo 區 -->
            <div class="p-3 text-center border-bottom">
                <!-- 假的佔位圖，可換成你的 LOGO -->
                <img src="logo.png" alt="logo" class="img-fluid" style="width: 60px;">
            </div>

            <!-- 導覽連結清單 -->
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-house-door-fill"></i> 首頁</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-calendar2-check"></i> 預約里程碑</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person-badge"></i> 幹員情報</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-globe"></i> 世界觀資料</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-camera-reels"></i> 影像資料</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-joystick"></i> 玩法介紹 & 集成工業知識</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-megaphone"></i> 公告</a></li>
            </ul>
        </div>

        <!-- 🔸 下半部：用戶資訊 / 按鈕 / 社群連結 -->
        <div class="bottom-section">
            <!-- 用戶資料區 -->
            <div class="mb-3">
                <div class="border rounded p-2 mb-2 text-center"><i class="bi bi-person"></i> 用戶</div>
                <div class="border rounded p-2 mb-2 text-center"><i class="bi bi-brush"></i> 創作者</div>
                <div class="border rounded p-2 mb-3 text-center"><i class="bi bi-volume-mute"></i> 聲音：關閉</div>
            </div>

            <!-- 「立即預約」按鈕 -->
            <button class="btn btn-reserve mb-3">立即預約</button>

            <!-- 底部社群 icon -->
            <div class="social-icons text-center">
                <a href="#"><i class="bi bi-twitter-x"></i></a>
                <a href="#"><i class="bi bi-facebook"></i></a>
                <a href="#"><i class="bi bi-youtube"></i></a>
                <a href="#"><i class="bi bi-controller"></i></a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS（必須放在 body 最後） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* 殘影的基本樣式 */
        .cursor-trail {
            position: fixed;
            top: 0;
            left: 0;
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.8);
            /* 白色半透明 */
            border-radius: 50%;
            /* 圓形 */
            pointer-events: none;
            /* 不影響滑鼠操作 */
            transform: translate(-50%, -50%);
            animation: fadeOut 0.8s linear forwards;
            /* 淡出動畫 */
            z-index: 9999;
        }

        /* 淡出動畫 */
        @keyframes fadeOut {
            0% {
                opacity: 1;
                transform: scale(1) translate(-50%, -50%);
            }

            100% {
                opacity: 0;
                transform: scale(0.3) translate(-50%, -50%);
            }
        }
    </style>

    <script>
        // 監聽滑鼠移動事件
        document.addEventListener("mousemove", function (e) {
            // 建立一個殘影元素
            const trail = document.createElement("div");
            trail.classList.add("cursor-trail");
            document.body.appendChild(trail);

            // 設定位置（跟隨滑鼠座標）
            trail.style.left = `${e.pageX}px`;
            trail.style.top = `${e.pageY}px`;

            // 動畫結束後移除元素，避免太多節點造成 lag
            setTimeout(() => {
                trail.remove();
            }, 800);
        });
    </script>

</body>

</html>
