<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>緹地導航列示範</title>

    <!-- ✅ 載入 Bootstrap 樣式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ 載入 Bootstrap Icons 圖示集（用於小圖示） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* 頁面整體背景 */
        body {
            background-color: #f8f9fa;
        }

        /* 左側側邊欄容器 */
        .sidebar {
            width: 250px;
            /* 側邊欄寬度 */
            height: 100vh;
            /* 滿版高度（vh = viewport height） */
            background-color: #ffffff;
            /* 白色背景 */
            border-right: 1px solid #e0e0e0;
            /* 右邊淡灰色邊線 */
            display: flex;
            flex-direction: column;
            /* 垂直排列子項目 */
            justify-content: space-between;
            /* 上下兩區分開 */
        }

        /* 導覽列的超連結樣式 */
        .nav-link {
            color: #333;
            font-weight: 500;
            padding: 12px 20px;
            /* 內距 */
            display: flex;
            /* 讓 icon 和文字水平對齊 */
            align-items: center;
            /* 垂直置中 */
            transition: 0.2s;
            /* 滑過時柔和變化 */
        }

        /* icon 的大小與透明度 */
        .nav-link i {
            font-size: 1.2rem;
            margin-right: 12px;
            opacity: 0.6;
        }

        /* 滑過或被選取的導覽項目樣式 */
        .nav-link.active,
        .nav-link:hover {
            background-color: #e9ecef;
            /* 灰底 */
            border-radius: 4px;
            color: #000;
        }

        /* icon 在滑過或選取時變清晰 */
        .nav-link.active i,
        .nav-link:hover i {
            opacity: 1;
        }

        /* 下半部（底部功能區）樣式 */
        .bottom-section {
            border-top: 1px solid #e0e0e0;
            padding: 16px;
        }

        /* 「立即預約」按鈕特效：黑色斜紋背景 */
        .btn-reserve {
            background: repeating-linear-gradient(45deg,
                    #000,
                    #000 10px,
                    #111 10px,
                    #111 20px);
            color: #fff;
            font-weight: 600;
            width: 100%;
            border: none;
        }

        /* 底部社群 icon 的樣式 */
        .social-icons a {
            color: #777;
            margin: 0 8px;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <!-- 📦 側邊欄整體容器 -->
    <div class="sidebar">

        <!-- 🔹 上半部：Logo + 導覽清單 -->
        <div>
            <!-- Logo 區 -->
            <div class="p-3 text-center border-bottom">
                <!-- 假的佔位圖，可換成你的 LOGO -->
                <img src="螢幕擷取畫面 2025-11-03 164442.png"
                    alt="logo" class="img-fluid" style="width: 60px;">
            </div>

            <!-- 導覽連結清單 -->
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-house-door-fill"></i> 首頁</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-calendar2-check"></i> 預約里程碑</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person-badge"></i> 幹員情報</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-globe"></i> 世界觀資料</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-camera-reels"></i> 影像資料</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-joystick"></i> 玩法介紹 & 集成工業知識</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-megaphone"></i> 公告</a></li>
            </ul>
        </div>

        <!-- 🔸 下半部：用戶資訊 / 按鈕 / 社群連結 -->
        <div class="bottom-section">
            <!-- 用戶資料區 -->
            <div class="mb-3">
                <div class="border rounded p-2 mb-2 text-center"><i class="bi bi-person"></i> 用戶</div>
                <div class="border rounded p-2 mb-2 text-center"><i class="bi bi-brush"></i> 創作者</div>
                <div class="border rounded p-2 mb-3 text-center"><i class="bi bi-volume-mute"></i> 聲音：關閉</div>
            </div>

            <!-- 「立即預約」按鈕 -->
            <button class="btn btn-reserve mb-3">立即預約</button>

            <!-- 底部社群 icon -->
            <div class="social-icons text-center">
                <a href="#"><i class="bi bi-twitter-x"></i></a>
                <a href="#"><i class="bi bi-facebook"></i></a>
                <a href="#"><i class="bi bi-youtube"></i></a>
                <a href="#"><i class="bi bi-controller"></i></a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS（必須放在 body 最後） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* 殘影的基本樣式 */
        .cursor-trail {
            position: fixed;
            top: 0;
            left: 0;
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.8);
            /* 白色半透明 */
            border-radius: 50%;
            /* 圓形 */
            pointer-events: none;
            /* 不影響滑鼠操作 */
            transform: translate(-50%, -50%);
            animation: fadeOut 0.8s linear forwards;
            /* 淡出動畫 */
            z-index: 9999;
        }

        /* 淡出動畫 */
        @keyframes fadeOut {
            0% {
                opacity: 1;
                transform: scale(1) translate(-50%, -50%);
            }

            100% {
                opacity: 0;
                transform: scale(0.3) translate(-50%, -50%);
            }
        }
    </style>

    <script>
        // 監聽滑鼠移動事件
        document.addEventListener("mousemove", function (e) {
            // 建立一個殘影元素
            const trail = document.createElement("div");
            trail.classList.add("cursor-trail");
            document.body.appendChild(trail);

            // 設定位置（跟隨滑鼠座標）
            trail.style.left = `${e.pageX}px`;
            trail.style.top = `${e.pageY}px`;

            // 動畫結束後移除元素，避免太多節點造成 lag
            setTimeout(() => {
                trail.remove();
            }, 800);
        });
    </script>

</body>

</html>
